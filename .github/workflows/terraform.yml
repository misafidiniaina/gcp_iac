name: Terraform validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without a backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate root configuration
        run: terraform validate -no-color
      - name: Validate optional VM module
        run: |
          terraform -chdir=modules/virtual_machine init -backend=false -input=false
          terraform -chdir=modules/virtual_machine validate -no-color
